# Built for Armv8.2 with RCpc, dot product and FP16 rather than the target's
# Armv8.0, so atomics compile to single instructions instead of retry loops
# and acquire loads to `ldapr` (see docs/workarounds/reference-cpu-build.md).
# rustc's `cortex-x1` is that set plus SSBS, which the kernels this was
# tested on don't report, so SSBS is turned back off. AES and SHA-2 come
# with it; SHA-3, SHA-512 and SM4 are optional extensions that stay off, and
# crypto code such as aws-lc checks for them at runtime. Devices whose CPUs
# lack these features can't run this build. The Armv9 instructions the
# reference tablet also has measured no faster there.
#
# The rest shrinks the `.so`. Like Zed's `script/bundle-linux`, the linker
# folds functions that compile to identical code; `-addrsig` records which
# functions have their address taken, so folding them can't change behavior.
# Packed relocations need Android 6, below the app's minSdk. A build ID,
# which the NDK's own build scripts always add, lets profilers and crash
# reports pair the stripped library with its symbols file.
[target.aarch64-linux-android]
rustflags = [
    "-C", "target-cpu=cortex-x1",
    "-C", "target-feature=-ssbs",
    "-C", "llvm-args=-addrsig",
    "-C", "link-arg=-Wl,--icf=safe",
    "-C", "link-arg=-Wl,--pack-dyn-relocs=android",
    "-C", "link-arg=-Wl,--build-id=sha1",
]

# The same instruction set for the C and C++ code that crates build with
# `cc`, such as the tree-sitter grammars and SQLite: `cc` doesn't forward
# rustc's `target-cpu`, so without this that code stays at Armv8.0. It's
# tuned for the reference tablet's prime core.
[env]
CFLAGS_aarch64_linux_android = "-march=armv8.2-a+fp16+rcpc+dotprod+aes+sha2 -mtune=cortex-x3"
CXXFLAGS_aarch64_linux_android = "-march=armv8.2-a+fp16+rcpc+dotprod+aes+sha2 -mtune=cortex-x3"
