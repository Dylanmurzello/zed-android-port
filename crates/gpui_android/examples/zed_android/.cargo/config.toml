# Built for the reference hardware's CPU, so atomics compile to single
# instructions instead of retry loops (see
# docs/workarounds/reference-cpu-build.md). Its cores implement SVE, MTE and
# SSBS, but its kernel doesn't enable them, so they're turned back off.
# Devices with older CPUs can't run this build. The fp16 this includes is
# also what `gemm-f16` (pulled in via candle → audio → call → git_ui →
# project_panel) needs to assemble its `fmla *.8h` SIMD path.
#
# The rest shrinks the `.so`. Like Zed's `script/bundle-linux`, the linker
# folds functions that compile to identical code; `-addrsig` records which
# functions have their address taken, so folding them can't change behavior.
# Packed relocations need Android 6, below the app's minSdk 26.
[target.aarch64-linux-android]
rustflags = [
    "-C", "target-cpu=cortex-x3",
    "-C", "target-feature=-sve,-sve2,-mte,-ssbs,+aes,+sha2,+sha3,+sm4",
    "-C", "llvm-args=-addrsig",
    "-C", "link-arg=-Wl,--icf=safe",
    "-C", "link-arg=-Wl,--pack-dyn-relocs=android",
]

# The same CPU for the C and C++ code that crates build with `cc`, such as
# the tree-sitter grammars and SQLite. Clang's `-mcpu=cortex-x3` would enable
# SVE and can't turn SSBS back off, so this names the instruction set the
# kernel reports and tunes for the core instead.
[env]
CFLAGS_aarch64_linux_android = "-march=armv8.5-a+fp16+fp16fml+i8mm+bf16+crypto -mtune=cortex-x3"
CXXFLAGS_aarch64_linux_android = "-march=armv8.5-a+fp16+fp16fml+i8mm+bf16+crypto -mtune=cortex-x3"
