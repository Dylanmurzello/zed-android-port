# Builds the Zdroid APK.
#
# - Tag pushes matching vX.Y.Z build a signed APK and publish it as a GitHub
#   pre-release. Promote it to "latest" after the device smoke test in
#   RELEASING.md; the in-app updater only follows the latest release.
# - Pushes to zdroid, pull requests, and manual runs upload the APK as a
#   workflow artifact named after the commit. Pull requests from this
#   repository are signed with the release key so their APKs install as an
#   update over a release (a different package name would break the
#   Bootstrap userland, which has com.zdroid compiled in). Pull requests from
#   forks never receive the key.
#
# The build job never sees the signing key. It builds an unsigned APK, and
# the sign job signs it with apksigner and checks its certificate, so crate
# build scripts and Gradle plugins can't read the key.
#
# Signing secrets and the release flow are described in FORK.md.
name: Zdroid APK

on:
  push:
    branches: [zdroid]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zdroid-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  APP_DIR: crates/gpui_android/examples/zed_android
  # Keep in sync with `ndkVersion` in android/app/build.gradle.kts.
  NDK_VERSION: 27.0.12077973
  ANDROID_PLATFORM: "26"
  BUILD_TOOLS_VERSION: 35.0.0
  CARGO_NDK_VERSION: 4.1.2
  GRADLE_VERSION: 8.14.6
  SCCACHE_VERSION: v0.18.0
  # Certificate of the key stored in ZDROID_KEYSTORE_BASE64. Every release
  # must be signed by it, otherwise installed copies can't upgrade in place.
  SIGNING_CERT_SHA256: 33:A2:DB:E8:82:DC:16:70:A3:AC:2C:1C:F2:C9:BD:D9:BF:99:05:06:D0:94:B1:0F:33:4C:D9:AA:81:D4:2E:67
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test fork crates
    # Host tests for the fork's own crates that build outside Android.
    # gpui_android only builds for Android, so its tests aren't run here.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Cargo registry
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # zizmor: ignore[cache-poisoning] v2.9.3
        with:
          cache-targets: false
          save-if: ${{ github.event_name == 'push' }}

      - name: Set up sccache
        if: github.ref_type != 'tag'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # zizmor: ignore[cache-poisoning] v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}

      - name: Enable sccache
        if: github.ref_type != 'tag'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Check formatting
        # The whole workspace, so the fork's edits to Zed's crates are
        # checked too. The Android app and the askpass helper are separate
        # workspaces.
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path "$APP_DIR/Cargo.toml" -- --check
          cargo fmt --manifest-path "$APP_DIR/askpass-helper/Cargo.toml" -- --check

      - name: Test Android host components
        run: cargo test -p zdroid_runtime -p gpui_android --locked

  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # checkout
    outputs:
      version: ${{ steps.apk.outputs.version }}
      apk_base: ${{ steps.apk.outputs.apk_base }}
      symbols_name: ${{ steps.apk.outputs.symbols_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' "$APP_DIR/android/app/build.gradle.kts")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in build.gradle.kts"
            exit 1
          fi

      - name: Put the Android target dir on the scratch disk
        # A release build needs more space than the root filesystem has free.
        run: |
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/zdroid-target
            sudo chown "$(id -u):$(id -g)" /mnt/zdroid-target
            mkdir -p "$APP_DIR/target"
            sudo mount --bind /mnt/zdroid-target "$APP_DIR/target"
          fi
          df -h / /mnt

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;$BUILD_TOOLS_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # zizmor: ignore[cache-poisoning] v6.4.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # The open-source provider built on actions/cache; the default one is
          # proprietary.
          cache-provider: basic
          # Releases build from a clean slate so a poisoned cache can't reach them.
          cache-disabled: ${{ github.ref_type == 'tag' }}

      - name: Install Rust toolchain
        # Installs the channel, targets and components from rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustc --version

      # Releases build from a clean slate so a poisoned cache can't reach them,
      # so the two caches below only run for pull requests and zdroid pushes.
      - name: Cache Cargo registry
        # Downloaded crates, git dependencies and cargo-ndk. Compiled artifacts
        # are left to sccache.
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # zizmor: ignore[cache-poisoning] v2.9.3
        with:
          workspaces: ${{ env.APP_DIR }}
          cache-targets: false
          save-if: ${{ github.event_name == 'push' }}

      - name: Set up sccache
        # Content-addressed compiler cache in the GitHub Actions cache. Unlike
        # cargo's target dir it survives a fresh checkout, so Zed crates that
        # didn't change aren't rebuilt. cc-rs picks it up for C code too.
        if: github.ref_type != 'tag'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # zizmor: ignore[cache-poisoning] v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}

      - name: Enable sccache
        if: github.ref_type != 'tag'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build native library
        working-directory: ${{ env.APP_DIR }}
        env:
          # Point the in-app updater at this repository's releases.
          ZDROID_RELEASE_REPO: ${{ github.repository }}
        run: cargo ndk -t arm64-v8a -P "$ANDROID_PLATFORM" -o android/app/src/main/jniLibs build --release --locked

      - name: Build APK
        # Gradle also builds and bundles zd-exec and zed-askpass-helper.
        working-directory: ${{ env.APP_DIR }}/android
        run: gradle --no-daemon --stacktrace lintDebug assembleRelease

      - name: Name APK
        id: apk
        env:
          # For pull requests, name test builds after the branch head rather
          # than the temporary merge commit GitHub builds.
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          apk="$APP_DIR/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          # The leading space skips `platformBuildVersionName` on the same line.
          version=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          if [ -z "$version" ]; then
            echo "::error::Could not read versionName from $apk"
            exit 1
          fi

          # The in-app updater looks for exactly Zdroid-X.Y.Z.apk on releases;
          # test builds carry the commit so they can't be mistaken for one.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            apk_base="Zdroid-$version"
          else
            apk_base="Zdroid-$version-${SOURCE_SHA:0:10}"
          fi

          mkdir -p dist
          cp "$apk" "dist/$apk_base-unsigned.apk"

          # The native libraries' symbol tables, which the APK leaves out.
          mkdir -p symbols
          symbols_name="$apk_base-native-symbols.zip"
          cp "$APP_DIR/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip" "symbols/$symbols_name"
          {
            echo "version=$version"
            echo "apk_base=$apk_base"
            echo "symbols_name=$symbols_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zdroid-apk-unsigned
          path: dist/
          if-no-files-found: error

      - name: Upload native symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zdroid-native-symbols
          path: symbols/
          if-no-files-found: error

  sign:
    name: Sign APK
    needs: build
    # Pull requests from forks never receive the key; the unsigned APK is
    # their only artifact.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    outputs:
      apk_name: ${{ steps.sign.outputs.apk_name }}
      apk_sha256: ${{ steps.sign.outputs.apk_sha256 }}
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zdroid-apk-unsigned
          path: unsigned

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION" > /dev/null

      - name: Sign and verify APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ZDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ZDROID_KEY_ALIAS || 'zdroid' }}
          APK_BASE: ${{ needs.build.outputs.apk_base }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::ZDROID_KEYSTORE_BASE64 and ZDROID_KEYSTORE_PASSWORD secrets are required for releases"
              exit 1
            fi
            echo "::warning::Signing secrets are not configured; only the unsigned APK is available"
            exit 0
          fi
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          # Pasted secrets easily pick up line breaks or stray characters;
          # check them here instead of failing deep inside apksigner.
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          export KEYSTORE_PASSWORD
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore" 2> /dev/null; then
            echo "::error::ZDROID_KEYSTORE_BASE64 is not valid base64. Recreate it from the output of 'base64 -w0 release.keystore' (see FORK.md)."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Could not open key '$KEY_ALIAS' in the decoded keystore: ZDROID_KEYSTORE_PASSWORD is wrong or ZDROID_KEYSTORE_BASE64 holds a different file."
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          unsigned="unsigned/$APK_BASE-unsigned.apk"
          apk_name="$APK_BASE.apk"
          # apksigner must sign an aligned APK. Gradle's output already is,
          # with the native libraries on 16 KB page boundaries.
          if ! "$build_tools/zipalign" -c -P 16 4 "$unsigned"; then
            echo "::error::$unsigned is not zip-aligned"
            exit 1
          fi
          mkdir -p dist
          # PKCS12 keystores use the store password for the key as well. The
          # v4 signature is a separate .idsig file for incremental adb
          # installs, which nothing here uses.
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --v4-signing-enabled false \
            --out "dist/$apk_name" \
            "$unsigned"

          "$build_tools/apksigner" verify --print-certs "dist/$apk_name" | tee "$RUNNER_TEMP/certs.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          expected=$(echo "$SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with certificate $actual, expected $expected"
            exit 1
          fi

          apk_sha256=$(sha256sum "dist/$apk_name" | cut -d' ' -f1)
          echo "$apk_name: $apk_sha256" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "apk_name=$apk_name"
            echo "apk_sha256=$apk_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.sign.outputs.apk_name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zdroid-apk
          path: dist/
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: [test, build, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload the APK
      pull-requests: read # read the Release Notes of merged pull requests
      id-token: write # sign the provenance attestation via OIDC
      attestations: write # store the provenance attestation
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zdroid-apk
          path: dist

      - name: Download native symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zdroid-native-symbols
          path: symbols

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.sign.outputs.apk_name }}

      - name: Check out the release notes script and texts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A subdirectory, because checkout cleans its path and dist/ holds
          # the APK.
          path: source
          persist-credentials: false
          sparse-checkout: |
            .github/release
            .github/scripts
            script/lib

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_NAME: ${{ needs.sign.outputs.apk_name }}
          APK_SHA256: ${{ needs.sign.outputs.apk_sha256 }}
        run: |
          # The annotated tag's message, minus its subject line, is an
          # optional Highlights paragraph. The script builds the rest from
          # .github/release and the merged pull requests' Release Notes.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(echo "$ref" | jq -r .object.type)" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message \
              | sed '1d' | sed '/./,$!d' > highlights.md
          else
            : > highlights.md
          fi
          node source/.github/scripts/zdroid-release-notes.js "$GITHUB_REF_NAME" \
            --version "$VERSION" --highlights highlights.md > notes.md
          {
            echo
            echo "### Verification"
            echo
            echo "* APK SHA-256: \`$APK_SHA256\`"
            echo "* Signing cert SHA-256: \`$SIGNING_CERT_SHA256\`"
            echo "* Built from commit \`${GITHUB_SHA:0:10}\` by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "* Build provenance: \`gh attestation verify $APK_NAME --repo $GITHUB_REPOSITORY\`"
          } >> notes.md
          cat notes.md

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_NAME: ${{ needs.sign.outputs.apk_name }}
          SYMBOLS_NAME: ${{ needs.build.outputs.symbols_name }}
        # `gh release create` refuses to overwrite an existing release, so a
        # re-run can never clobber an asset and reset its download count.
        # The symbols stay with the release for symbolizing its crashes.
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$APK_NAME" "symbols/$SYMBOLS_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zdroid $VERSION" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag
