# Keeps the SHA-pinned actions in .github/workflows/zdroid_apk.yml current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # main mirrors Dylanmurzello/zed-android-port; this fork's work lives on zdroid.
    target-branch: zdroid
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
